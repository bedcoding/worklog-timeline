<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590"><rect width="1120" height="590" fill="#eeebf3"/><g font-family="Segoe UI,Malgun Gothic,sans-serif"><rect x="135" y="43" width="850" height="503" rx="11" fill="#faf9fc" stroke="#ded9e9"/><rect x="135" y="43" width="850" height="40" rx="11" fill="#f5f2f9"/><circle cx="157" cy="64" r="4" fill="#c0b5d2"/><text x="180" y="69" font-size="11" fill="#8a7b9e">NOTES / DRAFT</text><rect x="260" y="108" width="601" height="413" rx="4" fill="white" stroke="#e7e2ef"/><text x="308" y="151" font-size="9" fill="#9b8caa" letter-spacing="2">WORKING DOCUMENT</text><text x="308" y="193" font-size="25" font-weight="700" fill="#493c5c">복잡한 내용을, 읽기 쉽게.</text><text x="308" y="221" font-size="11" fill="#998da5">초안을 바탕으로 구조를 정리한 가상 문서 예시</text><path d="M308 243h506" stroke="#eae4f0"/><text x="308" y="275" font-size="14" font-weight="600" fill="#665475">01   주요 내용 정리</text><rect x="308" y="302" width="491" height="8" rx="4" fill="#eeeaf3"/><rect x="308" y="323" width="443" height="8" rx="4" fill="#eeeaf3"/><rect x="308" y="344" width="370" height="8" rx="4" fill="#eeeaf3"/><rect x="308" y="382" width="506" height="63" rx="6" fill="#f3eff9"/><path d="M309 385v57" stroke="#a293ba" stroke-width="3"/><text x="328" y="408" font-size="11" fill="#7d6d93">담당자 검토</text><text x="328" y="430" font-size="10" fill="#a090b5">핵심 내용을 확인하고 표현과 예시를 보완했습니다.</text><text x="308" y="481" font-size="12" font-weight="600" fill="#786887">02   다음 단계</text></g></svg>