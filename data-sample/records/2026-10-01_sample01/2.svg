<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590"><rect width="1120" height="590" fill="#e5eade"/><g font-family="Segoe UI,Malgun Gothic,sans-serif"><rect x="136" y="42" width="848" height="500" rx="12" fill="#25322d"/><path d="M148 42h824a12 12 0 0 1 12 12v35H136V54a12 12 0 0 1 12-12" fill="#303f37"/><circle cx="158" cy="66" r="4" fill="#adbc9f"/><text x="181" y="71" font-size="12" fill="#b9c8ae">organize.py 변경 내용</text><text x="179" y="132" font-size="12" fill="#a5b799">파일 분류 로직을 검토한 뒤 반영했습니다.</text><text x="166" y="184" font-size="12" fill="#69806d">1</text><rect x="192" y="163" width="745" height="31" rx="3" fill="#293a31"/><text xml:space="preserve" x="208" y="184" font-size="15" font-family="Consolas,monospace" fill="#aec1b2">def organize_files(source):</text><text x="166" y="223" font-size="12" fill="#69806d">2</text><rect x="192" y="202" width="745" height="31" rx="3" fill="#293a31"/><text xml:space="preserve" x="208" y="223" font-size="15" font-family="Consolas,monospace" fill="#aec1b2">    files = collect_files(source)</text><text x="166" y="262" font-size="12" fill="#69806d">3</text><rect x="192" y="241" width="745" height="31" rx="3" fill="#293a31"/><text xml:space="preserve" x="208" y="262" font-size="15" font-family="Consolas,monospace" fill="#aec1b2">    for file in files:</text><text x="166" y="301" font-size="12" fill="#69806d">4</text><rect x="192" y="280" width="745" height="31" rx="3" fill="#36523e"/><text xml:space="preserve" x="208" y="301" font-size="15" font-family="Consolas,monospace" fill="#c6e7ad">        category = detect_category(file)</text><text x="166" y="340" font-size="12" fill="#69806d">5</text><rect x="192" y="319" width="745" height="31" rx="3" fill="#36523e"/><text xml:space="preserve" x="208" y="340" font-size="15" font-family="Consolas,monospace" fill="#c6e7ad">        destination = ensure_folder(category)</text><text x="166" y="379" font-size="12" fill="#69806d">6</text><rect x="192" y="358" width="745" height="31" rx="3" fill="#36523e"/><text xml:space="preserve" x="208" y="379" font-size="15" font-family="Consolas,monospace" fill="#c6e7ad">        move_safely(file, destination)</text><text x="166" y="418" font-size="12" fill="#69806d">7</text><rect x="192" y="397" width="745" height="31" rx="3" fill="#36523e"/><text xml:space="preserve" x="208" y="418" font-size="15" font-family="Consolas,monospace" fill="#c6e7ad">    return build_summary(files)</text><rect x="179" y="481" width="215" height="30" rx="6" fill="#435e39"/><text x="195" y="501" font-size="11" fill="#d7edba">✓ 샘플 파일로 동작 확인 완료</text></g></svg>